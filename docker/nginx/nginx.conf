events { worker_connections 1024; }

http {
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        ssl_certificate /etc/letsencrypt/live/attendtrack.local/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/attendtrack.local/privkey.pem;

        # Security headers (Gap 13)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' wss:; frame-ancestors 'none';" always;

        # Strip X-Forwarded-For from external clients (Gap 3 — NEVER trust client-supplied IP)
        proxy_set_header X-Forwarded-For "";

        # Restrict Hikvision webhook endpoint to device IP only
        location /api/hikvision/events {
            allow 192.168.1.50;
            deny all;
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
        }

        # SignalR WebSocket support
        location /hubs/ {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
